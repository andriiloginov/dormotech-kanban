<body class="bg-white font-sans text-neutral-950 antialiased dark:bg-neutral-950 dark:text-white">

<div id="keyScreen" hidden class="grid min-h-dvh place-items-center p-4">
  <form id="keyForm" class="w-full max-w-sm space-y-4">
    <div>
      <h1 class="text-base font-semibold">Dormotech Design</h1>
    </div>
    <label class="block space-y-1.5">
      <span class="text-sm font-medium">Enter access key</span>
      <input id="keyInput" type="password" required autocomplete="off" class="block w-full rounded-md border border-neutral-950/15 bg-white px-3 py-2 text-sm outline-none focus:border-accent dark:border-white/15 dark:bg-neutral-900">
    </label>
    <p id="keyError" class="text-sm text-neutral-600 empty:hidden dark:text-neutral-300"></p>
    <button class="w-full rounded-md bg-accent px-3 py-2 text-sm font-medium text-accent-ink hover:bg-accent/90">Sign in</button>
  </form>
</div>

<div id="app" hidden class="flex min-h-dvh flex-col">
  <header class="sticky top-0 z-10 border-b border-neutral-950/10 bg-white/90 backdrop-blur dark:border-white/10 dark:bg-neutral-950/90">
    <div class="flex flex-wrap items-center gap-2 px-4 py-3">
      <h1 class="flex items-center gap-2.5 text-sm font-semibold">
        <svg class="h-7 w-auto" aria-hidden="true" viewBox="0 0 239.1 239.6" fill="currentColor"><path d="M120.295 40.7065C77.1585 40.7065 42.3018 75.7124 42.3018 118.928C42.3018 162.143 77.2267 197.115 120.346 197.149C163.466 197.132 198.374 162.126 198.374 118.928C198.374 75.7295 163.432 40.7065 120.295 40.7065ZM120.295 179.211C87.0227 179.211 60.1049 152.244 60.1049 118.911C60.1049 85.5776 87.0227 58.6106 120.295 58.6106C153.567 58.6106 180.485 85.5605 180.485 118.911C180.485 152.261 153.499 179.211 120.295 179.211Z"/><path d="M219.516 34.2549C219.516 19.901 207.846 8.20957 193.518 8.20957C187.078 8.20957 181.252 10.6673 176.703 14.5588C159.701 5.29099 140.279 0 119.528 0C53.5118 0 0 53.6097 0 119.747C0 185.884 53.5118 239.511 119.528 239.511C185.545 239.511 239.057 185.902 239.057 119.747C239.057 92.9337 230.164 68.2196 215.325 48.2675C217.931 44.2054 219.499 39.4093 219.499 34.2378M212.241 34.2549C212.241 37.5148 211.321 40.5529 209.839 43.2325C209.294 44.2054 208.698 45.127 207.999 45.9804C207.624 46.4412 207.284 46.9191 206.875 47.3458C205.801 48.4382 204.592 49.394 203.263 50.1791C200.418 51.9371 197.096 53.0123 193.501 53.0123C183.194 53.0123 174.778 44.5809 174.778 34.2549C174.778 31.7118 175.289 29.3053 176.209 27.0865C176.822 25.6016 177.674 24.2532 178.628 22.9902C178.935 22.5806 179.276 22.188 179.616 21.7955C180.655 20.6349 181.797 19.5596 183.092 18.6721C186.073 16.6581 189.651 15.4804 193.501 15.4804C203.808 15.4804 212.224 23.9119 212.224 34.2378M119.545 228.127C59.8153 228.127 11.3804 179.604 11.3804 119.764C11.3804 59.9247 59.8153 11.4012 119.545 11.4012C137.655 11.4012 154.76 15.873 169.786 23.7583C168.355 26.9841 167.537 30.5171 167.537 34.2549C167.537 48.6088 179.207 60.3002 193.535 60.3002C198.544 60.3002 203.178 58.7983 207.147 56.3405C220.027 74.1763 227.71 96.0912 227.71 119.764C227.71 179.604 179.276 228.127 119.545 228.127Z"/></svg>
        <span class="max-sm:sr-only">Dormotech Design</span>
      </h1>
      <nav class="mr-auto ml-2 flex rounded-md bg-neutral-100 p-0.5 text-sm font-medium dark:bg-white/10" aria-label="View">
        <button type="button" data-view="board" class="rounded px-2.5 py-1 text-neutral-500 aria-pressed:bg-accent aria-pressed:text-accent-ink aria-pressed:shadow-xs dark:text-neutral-400">Board</button>
        <button type="button" data-view="stats" class="rounded px-2.5 py-1 text-neutral-500 aria-pressed:bg-accent aria-pressed:text-accent-ink aria-pressed:shadow-xs dark:text-neutral-400">Stats</button>
      </nav>
      <div id="boardControls" class="flex items-center gap-2 max-sm:order-last max-sm:basis-full sm:flex-wrap">
      <select id="tabSelect" aria-label="Month" class="h-8 rounded-md max-sm:min-w-0 max-sm:flex-1 border border-neutral-950/15 bg-white px-2 text-sm dark:border-white/15 dark:bg-neutral-900"></select>
      <select id="projectFilter" aria-label="Project" class="h-8 max-w-40 rounded-md max-sm:min-w-0 max-sm:flex-1 border border-neutral-950/15 bg-white px-2 text-sm dark:border-white/15 dark:bg-neutral-900"></select>
      <button id="orderBtn" type="button" class="flex h-8 shrink-0 items-center gap-1.5 rounded-md border border-neutral-950/15 px-2.5 text-sm text-neutral-600 hover:bg-neutral-50 dark:border-white/15 dark:text-neutral-300 dark:hover:bg-white/5"><span id="orderIcon" class="flex"></span><span id="orderLabel" class="max-sm:hidden"></span></button>
      <span id="total" class="shrink-0 px-1 text-sm tabular-nums text-neutral-500 dark:text-neutral-400"></span>
      </div>
      <button id="refreshBtn" type="button" class="h-8 rounded-md border border-neutral-950/15 px-3 text-sm font-medium hover:bg-neutral-50 disabled:opacity-50 dark:border-white/15 dark:hover:bg-white/5" aria-label="Refresh"><span id="refreshIcon" class="flex sm:hidden"></span><span class="max-sm:hidden">Refresh</span></button>
      <button id="logoutBtn" type="button" class="h-8 rounded-md border border-red-600/30 px-3 text-sm font-medium text-red-600 hover:bg-red-50 dark:border-red-400/40 dark:text-red-400 dark:hover:bg-red-400/10">Log out</button>
    </div>
  </header>
  <main id="stats" hidden class="mx-auto w-full max-w-5xl space-y-10 p-4 pb-16"></main>
  <main id="board" class="flex flex-1 flex-col gap-3 p-4 lg:flex-row lg:items-start"></main>
</div>

<dialog id="editDialog" class="m-auto w-[min(32rem,calc(100%-2rem))] rounded-lg border border-neutral-950/10 bg-white p-0 text-neutral-950 shadow-xl backdrop:bg-neutral-950/40 dark:border-white/10 dark:bg-neutral-900 dark:text-white">
  <form id="editForm" method="dialog" class="space-y-4 p-5">
    <h2 class="text-base font-semibold">Task</h2>
    <label class="block space-y-1.5"><span class="text-sm font-medium">Title</span>
      <textarea name="title" rows="2" required class="block w-full resize-y rounded-md border border-neutral-950/15 bg-white px-3 py-2 text-sm outline-none focus:border-accent dark:border-white/15 dark:bg-neutral-950"></textarea></label>
    <div class="grid grid-cols-2 gap-3 sm:grid-cols-3">
      <label class="block space-y-1.5"><span class="text-sm font-medium">Hours</span>
        <input name="hours" inputmode="decimal" placeholder="e.g. 4.5" class="block w-full rounded-md border border-neutral-950/15 bg-white px-3 py-2 text-sm outline-none focus:border-accent dark:border-white/15 dark:bg-neutral-950"></label>
      <label class="block space-y-1.5"><span class="text-sm font-medium">Project</span>
        <input name="project" list="projectList" class="block w-full rounded-md border border-neutral-950/15 bg-white px-3 py-2 text-sm outline-none focus:border-accent dark:border-white/15 dark:bg-neutral-950"></label>
      <label class="col-span-2 block space-y-1.5 sm:col-span-1"><span class="text-sm font-medium">Assignee</span>
        <input name="assignee" list="assigneeList" class="block w-full rounded-md border border-neutral-950/15 bg-white px-3 py-2 text-sm outline-none focus:border-accent dark:border-white/15 dark:bg-neutral-950"></label>
      <div role="group" aria-labelledby="deadlineLabel" class="col-span-2 space-y-1.5 sm:col-span-3">
        <span id="deadlineLabel" class="block text-sm font-medium">Deadline</span>
        <div class="flex gap-2">
          <input name="deadline" type="date" aria-label="Deadline date" class="block min-w-0 flex-1 rounded-md border border-neutral-950/15 bg-white px-3 py-2 text-sm outline-none focus:border-accent dark:border-white/15 dark:bg-neutral-950">
          <input name="deadlineTime" type="time" aria-label="Deadline time" class="block w-32 rounded-md border border-neutral-950/15 bg-white px-3 py-2 text-sm outline-none focus:border-accent disabled:opacity-50 dark:border-white/15 dark:bg-neutral-950">
        </div>
      </div>
      <label class="col-span-2 block space-y-1.5 sm:col-span-1"><span class="text-sm font-medium">Done date</span>
        <input name="doneDate" type="date" class="block w-full rounded-md border border-neutral-950/15 bg-white px-3 py-2 text-sm outline-none focus:border-accent dark:border-white/15 dark:bg-neutral-950"></label>
    </div>
    <label class="block space-y-1.5"><span class="text-sm font-medium">Comment</span>
      <textarea name="comment" rows="3" class="block w-full resize-y rounded-md border border-neutral-950/15 bg-white px-3 py-2 text-sm outline-none focus:border-accent dark:border-white/15 dark:bg-neutral-950"></textarea></label>
    <p id="editError" class="text-sm text-neutral-600 empty:hidden dark:text-neutral-300"></p>
    <div class="flex justify-end gap-2">
      <button value="cancel" formnovalidate class="rounded-md border border-neutral-950/15 px-3 py-2 text-sm font-medium hover:bg-neutral-50 dark:border-white/15 dark:hover:bg-white/5">Cancel</button>
      <button value="save" class="rounded-md bg-accent px-3 py-2 text-sm font-medium text-accent-ink hover:bg-accent/90">Save</button>
    </div>
  </form>
</dialog>
<datalist id="projectList"></datalist>
<datalist id="assigneeList"></datalist>

<div id="tip" hidden class="pointer-events-none fixed z-30 max-w-64 rounded-md bg-neutral-950 px-2.5 py-1.5 text-xs text-white shadow-lg dark:bg-white dark:text-neutral-950"></div>
<div id="toast" role="status" aria-live="polite" class="pointer-events-none fixed inset-x-4 bottom-4 z-20 mx-auto max-w-md rounded-md bg-neutral-950 px-4 py-3 text-sm text-white shadow-lg transition-opacity empty:opacity-0 dark:bg-white dark:text-neutral-950"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxCWXJuV088YScFiY7BAkahVyzJ_ZN0158yZLtuGbqOSmVcqcN7X4GT7m0YNaUVn0xS/exec";
const REFRESH_MS = 30000;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const norm = (s) => String(s ?? '').trim().toLowerCase();
const fmtHours = (n) => (+n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
const safeUrl = (u) => (/^https?:\/\//i.test(u) ? u : '');
const PREFIX = 'dormotech:'; // сайт Alterate теж на andriiloginov.github.io, а localStorage спільний для всього домену
const store = {
  get: (k) => { try { return localStorage.getItem(PREFIX + k); } catch { return null; } },
  set: (k, v) => { try { v == null ? localStorage.removeItem(PREFIX + k) : localStorage.setItem(PREFIX + k, v); } catch {} },
};

const MESSAGES = {
  network: 'Cannot reach the API. Check your connection, API_URL and that the web app access is set to Anyone.',
  html: 'The API returned a page instead of data (probably a Google sign-in). Check that web app access is set to Anyone and API_URL ends with /exec.',
  bad_response: 'The API returned an unexpected response.',
  unauthorized: 'Invalid access key.',
  conflict: 'The row changed in the sheet, so the board was reloaded. Try again.',
  tab_not_found: 'Tab not found. Click Refresh.',
  title_required: 'Task title is required.',
  bad_hours: 'Hours must be a number, e.g. 4.5.',
  bad_date: 'Invalid date.',
  no_tabs: 'No tab with a "Task" column found.',
  old_script: 'The page is newer than the script: paste the latest Code.gs into Apps Script and update the deployment (Manage deployments, ✏️, New version).',
  no_api_url: 'API_URL is not set in src/index.src.html.',
};
class ApiError extends Error {
  constructor(code, detail) { super(MESSAGES[code] || `Error: ${code}${detail ? ` (${detail})` : ''}`); this.code = code; }
}

let key = '';
const state = { order: store.get('kanbanOrder') === 'asc' ? 'asc' : 'desc', tabs: [], tab: '', data: null, lists: {}, project: '', pending: 0, dragging: false, lastDrag: 0, loadSeq: 0, stats: null, statsStale: false };

async function api(query, body) {
  if (API_URL.includes('PASTE_')) throw new ApiError('no_api_url');
  let text;
  try {
    const res = body
      ? await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, key }) })
      : await fetch(`${API_URL}?${new URLSearchParams({ ...query, key })}`);
    text = await res.text();
  } catch {
    throw new ApiError('network');
  }
  let data;
  try { data = JSON.parse(text); } catch { throw new ApiError(text.trimStart().startsWith('<') ? 'html' : 'bad_response'); }
  if (data.error) {
    if (data.error === 'unauthorized') logout(MESSAGES.unauthorized);
    throw new ApiError(data.error, data.message);
  }
  return data;
}

let toastTimer;
function toast(msg) {
  $('#toast').textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('#toast').textContent = ''; }, 6000);
}

// ---------- ключ ----------
function logout(msg) {
  key = '';
  store.set('kanbanKey', null);
  store.set('kanbanBoot', null);
  store.set('kanbanStats', null);
  Object.assign(state, { data: null, lists: {}, stats: null });
  projectColors = null;
  $('#app').hidden = true;
  $('#keyScreen').hidden = false;
  $('#keyError').textContent = msg || '';
  $('#keyInput').focus();
}

$('#logoutBtn').addEventListener('click', () => logout());

$('#keyForm').addEventListener('submit', (e) => {
  e.preventDefault();
  key = $('#keyInput').value.trim();
  store.set('kanbanKey', key);
  start();
});

// ---------- завантаження ----------
function boardMessage(msg) {
  $('#board').innerHTML = `<p class="w-full py-16 text-center text-sm text-neutral-500 dark:text-neutral-400">${esc(msg)}</p>`;
}

// Кеш у браузері: сторінка одразу показує дані з минулого разу, а свіжі підтягує у фоні.
const cacheGet = (k) => { try { const c = JSON.parse(store.get(k)); return c && c.api === API_URL ? c.data : null; } catch { return null; } };
const cacheSet = (k, data) => store.set(k, JSON.stringify({ api: API_URL, data }));

function showList(data) {
  state.data = data;
  state.lists[data.tab] = data;
  cacheSet('kanbanBoot', { ...data, tabs: state.tabs });
  render();
}

function showTabs(tabs, tab) {
  state.tabs = tabs;
  state.tab = tab;
  $('#tabSelect').innerHTML = tabs.map((t) => `<option>${esc(t.name)}</option>`).join('');
  $('#tabSelect').value = tab;
}

async function start({ fresh = false } = {}) {
  $('#keyScreen').hidden = true;
  $('#app').hidden = false;
  if (fresh) state.statsStale = true;
  const boot = cacheGet('kanbanBoot');
  const opening = !state.data; // при відкритті сторінки — завжди найновіша вкладка; «Оновити» лишає поточну
  if (!state.data && boot?.tabs) {
    showTabs(boot.tabs, boot.tab);
    showList(boot);
  } else if (!state.data) boardMessage('Loading…');
  setView(state.view || store.get('kanbanView'));
  const seq = ++state.loadSeq, btn = $('#refreshBtn');
  btn.disabled = true;
  try {
    const data = await api({ action: 'list', tab: opening ? '' : state.tab, withTabs: 1, ...(fresh && { fresh: 1 }) });
    if (seq !== state.loadSeq) return;
    if (!data.tabs) return boardMessage(MESSAGES.old_script);
    showTabs(data.tabs, data.tab);
    showList(data);
    if (!state.stats) setTimeout(() => loadStats({ background: true }), 300); // статистика — заздалегідь
  } catch (e) {
    if (seq !== state.loadSeq || e.code === 'unauthorized') return;
    if (e.code === 'tab_not_found' && !state.tab) e.message = MESSAGES.old_script;
    if (state.data) toast(e.message); else boardMessage(e.message);
  } finally {
    if (seq === state.loadSeq) btn.disabled = false;
  }
}

async function loadList({ silent = false, fresh = false } = {}) {
  const seq = ++state.loadSeq, tab = state.tab, known = state.lists[tab];
  const btn = $('#refreshBtn');
  btn.disabled = true;
  if (!silent) {
    if (known) { state.data = known; render(); } else { state.data = null; boardMessage('Loading…'); }
  }
  try {
    const data = await api({ action: 'list', tab, ...(fresh && { fresh: 1 }) });
    if (seq !== state.loadSeq) return;
    showList(data);
  } catch (e) {
    if (seq !== state.loadSeq || e.code === 'unauthorized') return;
    if (state.data) toast(e.message); else boardMessage(e.message);
  } finally {
    if (seq === state.loadSeq) btn.disabled = false;
  }
}

$('#tabSelect').addEventListener('change', (e) => { state.tab = e.target.value; state.project = ''; loadList(); });
$('#projectFilter').addEventListener('change', (e) => { state.project = e.target.value; render(); });
$('#refreshBtn').addEventListener('click', () => (state.view === 'stats' ? loadStats({ fresh: true }) : start({ fresh: true })));

// Тихе оновлення: раз на 30 с і щоразу, коли повертаєтесь на вкладку (наприклад, із таблиці).
let lastAuto = 0;
function autoRefresh() {
  if (Date.now() - lastAuto < 5000) return;
  if (document.visibilityState === 'visible' && key && state.view === 'board' && state.data && !state.pending && !state.dragging &&
      !$('#editDialog').open && !document.querySelector('[data-add-form]')) {
    lastAuto = Date.now();
    loadList({ silent: true });
  }
}
setInterval(autoRefresh, REFRESH_MS);
document.addEventListener('visibilitychange', autoRefresh);
window.addEventListener('focus', autoRefresh);

// ---------- рендер ----------
const DOT = {
  'not started': 'border border-neutral-400 dark:border-neutral-500',
  'in progress': 'bg-neutral-400 dark:bg-neutral-500',
  done: 'bg-neutral-950 dark:bg-white',
};
// Іконки: SF Symbols зі шрифту SF Pro Rounded, якщо він встановлений на пристрої (вбудовувати його ліцензія Apple не дозволяє).
// Інакше — Fluent UI System Icons (Microsoft, MIT).
const HAS_SF = (() => {
  try {
    const c = document.createElement('canvas').getContext('2d');

const ICON_BRIEF = icon(0x10023f, fluent(20, 'M6.5 10a.5.5 0 0 0 0 1h7a.5.5 0 0 0 0-1zm0 2a.5.5 0 0 0 0 1h7a.5.5 0 0 0 0-1zm0 2a.5.5 0 0 0 0 1h7a.5.5 0 0 0 0-1zM4 4c0-1.1.9-2 2-2h4.59q.62.01 1.06.44l3.91 3.91c.28.28.44.67.44 1.06V16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V8h-3.5A1.5 1.5 0 0 1 10 6.5V3zm5.5 4h3.3L11 3.2v3.3c0 .28.22.5.5.5', 'size-4'), 'text-[15px]');
const ICON_FILE = icon(0x100262, fluent(20, 'm4.83 10.48 5.65-5.65a3 3 0 0 1 4.25 4.24L8 15.8a1.5 1.5 0 0 1-2.12-2.12l6-6.01a.5.5 0 1 0-.7-.71l-6 6.01a2.5 2.5 0 0 0 3.53 3.54l6.71-6.72a4 4 0 1 0-5.65-5.66L4.12 9.78a.5.5 0 0 0 .7.7', 'size-4'), 'text-[15px]');

function showOrder() {
  const label = state.order === 'desc' ? 'Newest first' : 'Oldest first';
  $('#orderLabel').textContent = label;
  $('#orderBtn').title = `${label}. Click to change`;
  $('#orderBtn').setAttribute('aria-label', $('#orderBtn').title);
}
showOrder();
$('#orderBtn').addEventListener('click', () => {
  state.order = state.order === 'desc' ? 'asc' : 'desc';
  store.set('kanbanOrder', state.order);
  showOrder();
  render();
});

function columnsOf(data) {
  const cols = data.statuses.slice();
  for (const it of data.items) {
    if (!cols.some((s) => norm(s) === norm(it.status))) cols.push(it.status.trim());
  }
  return cols;
}
const columnFor = (cols, status) => cols.find((s) => norm(s) === norm(status)) ?? status;

function render() {
  const data = state.data;
  if (!data) return;
  const projects = [...new Set(data.items.map((i) => i.project).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'en'));
  if (state.project && !projects.includes(state.project)) state.project = '';
  $('#projectFilter').innerHTML = `<option value="">All projects</option>` + projects.map((p) => `<option>${esc(p)}</option>`).join('');
  $('#projectFilter').value = state.project;
  $('#projectList').innerHTML = projects.map((p) => `<option value="${esc(p)}">`).join('');
  $('#assigneeList').innerHTML = [...new Set(data.items.map((i) => i.assignee).filter(Boolean))].map((p) => `<option value="${esc(p)}">`).join('');

  const visible = data.items.filter((i) => !state.project || i.project === state.project);
  $('#total').textContent = `${fmtHours(visible.reduce((s, i) => s + (i.hours || 0), 0))} h`;
  const cols = columnsOf(data);
  const ordered = state.order === 'desc' ? visible.slice().reverse() : visible; // desc — останні рядки таблиці зверху
  const itemsOf = (status) => ordered.filter((i) => columnFor(cols, i.status) === status);
  // Основні статуси — завжди; додаткові (Hold, Approved…) — лише коли в них є задачі. Те саме — у списку статусів на картці.
  const shown = cols.filter((s) => DOT[norm(s)] || itemsOf(s).length);
  $('#board').innerHTML = shown.map((status) => columnHtml(status, shown, itemsOf(status))).join('');

  if (!window.Sortable) return toast('Drag and drop is unavailable. Change the status in the card menu.');
  document.querySelectorAll('[data-list]').forEach((el) => Sortable.create(el, {
    group: 'board', animation: 150, forceFallback: true, fallbackTolerance: 4,
    delay: 250, delayOnTouchOnly: true, filter: 'select, a, [data-temp]', preventOnFilter: false,
    easing: 'cubic-bezier(0.4, 0, 0.2, 1)', ghostClass: 'drag-ghost', fallbackClass: 'drag-clone',
    onStart: () => { state.dragging = true; document.body.classList.add('cursor-grabbing', 'select-none'); },
    onMove: (e) => { dropTarget(e.to); },
    onEnd: (e) => {
      state.dragging = false;
      dropTarget(null);
      document.body.classList.remove('cursor-grabbing', 'select-none');
      state.lastDrag = Date.now();
      const item = findItem(e.item.dataset.row);
      if (!item) return;
      if (e.from !== e.to) return save(item, { status: e.to.dataset.list });
      if (e.oldIndex === e.newIndex) return;
      const sibling = (dir) => { let el = e.item; while ((el = el[dir]) && !el.matches('[data-row]')); return el && findItem(el.dataset.row); };
      // Сусід знизу на екрані — наступний рядок таблиці (або попередній, коли нові зверху).
      const below = sibling('nextElementSibling'), above = below ? null : sibling('previousElementSibling');
      if (state.order === 'desc') move(item, above, below);
      else move(item, below, above);
    },
  }));
}

// Підсвічує колонку, над якою зараз картка.
function dropTarget(list) {
  document.querySelectorAll('.drop-target').forEach((el) => { if (el !== list) el.classList.remove('drop-target'); });
  list?.classList.add('drop-target');
}

function columnHtml(status, cols, items) {
  const hours = items.reduce((s, i) => s + (i.hours || 0), 0);
  const dot = DOT[norm(status)] || 'border border-dashed border-neutral-400 dark:border-neutral-500';
  return `<section class="flex min-w-0 flex-col rounded-lg bg-neutral-50 lg:flex-1 dark:bg-white/5">
    <div class="flex items-center gap-2 px-3 pt-3 pb-2">
      <span class="size-2 shrink-0 rounded-full ${dot}"></span>
      <h2 class="truncate text-sm font-medium">${esc(status || 'No status')}</h2>
      <span class="text-sm tabular-nums text-neutral-500 dark:text-neutral-400">${items.length}</span>
      <span class="ml-auto text-xs tabular-nums text-neutral-500 dark:text-neutral-400">${fmtHours(hours)} h</span>
    </div>
    <div data-list="${esc(status)}" class="flex min-h-20 flex-col gap-2 rounded-lg px-2 pb-2">
      ${items.map((i) => cardHtml(i, cols)).join('') || '<p data-temp class="py-6 text-center text-xs text-neutral-400 dark:text-neutral-500">Empty</p>'}
    </div>
    <div class="px-2 pb-2">
      <button type="button" data-add="${esc(status)}" class="w-full rounded-md px-2 py-1.5 text-left text-sm text-neutral-500 hover:bg-neutral-950/5 hover:text-neutral-950 dark:text-neutral-400 dark:hover:bg-white/5 dark:hover:text-white">+ Task</button>
    </div>
  </section>`;
}

// Колір проєкту — той самий, що в статистиці (рейтинг за годинами за весь період). Поки статистики немає — сірий.
let projectColors = null;
function projectColor(name) {
  if (!projectColors) {
    const stats = state.stats || cacheGet('kanbanStats');
    if (!stats) return null;
    projectColors = new Map(computeStats(stats).projects.filter((p) => !p.other).map((p) => [norm(p.name), p.color]));
  }
  return projectColors.get(norm(name));
}

function chipHtml(name) {
  const color = projectColor(name);
  return color
    ? `<span class="chip inline-flex items-center gap-1 rounded px-1.5 py-0.5 font-medium text-neutral-800 dark:text-neutral-100" style="--c:${color}"><span class="size-1.5 rounded-full" style="background:var(--c)"></span>${esc(name)}</span>`
    : `<span class="rounded bg-neutral-100 px-1.5 py-0.5 font-medium text-neutral-700 dark:bg-white/10 dark:text-neutral-300">${esc(name)}</span>`;
}

function cardHtml(i, cols) {
  const meta = [
    i.project && chipHtml(i.project),
    i.hours != null && `<span class="tabular-nums">${fmtHours(i.hours)} h</span>`,
    i.assignee && `<span>${esc(i.assignee)}</span>`,
    i.doneDate && norm(i.status) === 'done' ? `<span title="Done" class="inline-flex items-center gap-0.5">${ICON_CHECK}${esc(i.doneDate)}</span>`
      : i.deadline ? `<span title="Deadline">due ${esc(i.deadline)}</span>`
      : i.doneDate && `<span title="Date">${esc(i.doneDate)}</span>`,
  ].filter(Boolean).join('');
  const links = [[i.briefLink, 'Brief', ICON_BRIEF], [i.fileLink, 'File', ICON_FILE]]
    .filter(([u]) => safeUrl(u))
    .map(([u, label, icon]) => `<a href="${esc(u)}" target="_blank" rel="noopener" title="${label}" aria-label="${label}" class="rounded p-1 text-neutral-500 hover:bg-neutral-950/5 hover:text-neutral-950 dark:text-neutral-400 dark:hover:bg-white/10 dark:hover:text-white">${icon}</a>`).join('');
  const current = columnFor(cols, i.status);
  const options = cols.map((s) => `<option value="${esc(s)}"${s === current ? ' selected' : ''}>${esc(s || 'No status')}</option>`).join('');
  return `<article ${i.row ? `data-row="${i.row}" tabindex="0"` : 'data-temp'} class="cursor-pointer rounded-md border border-neutral-950/10 bg-white p-3 shadow-xs outline-none hover:border-neutral-950/25 focus-visible:border-neutral-950 dark:border-white/10 dark:bg-neutral-900 dark:hover:border-white/25 dark:focus-visible:border-white">
    <p class="text-sm leading-snug font-medium break-words">${esc(i.title)}</p>
    ${meta ? `<div class="mt-2 flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-neutral-500 dark:text-neutral-400">${meta}</div>` : ''}
    <div class="mt-2 flex items-center justify-between gap-2">
      ${i.row ? `<select data-status-select aria-label="Status" class="h-7 min-w-0 rounded border border-transparent bg-transparent px-1 text-xs text-neutral-500 hover:border-neutral-950/15 dark:text-neutral-400 dark:hover:border-white/15">${options}</select>`
        : '<span class="flex h-7 items-center px-1 text-xs text-neutral-400 dark:text-neutral-500">Saving…</span>'}
      ${links ? `<span class="flex shrink-0 gap-0.5">${links}</span>` : ''}
    </div>
  </article>`;
}

const findItem = (row) => state.data?.items.find((i) => String(i.row) === String(row));

// ---------- зміни ----------
async function save(item, patch) {
  const tab = state.tab, before = { ...item };
  state.loadSeq++; // відповідь завантаження, що вже летить, застаріла — не перезаписуємо нею зміну
  Object.assign(item, patch);
  render();
  state.pending++;
  try {
    const res = await api(null, { action: 'update', tab, row: item.row, expectedTitle: before.title, patch });
    Object.assign(item, res.item);
    state.statsStale = true; // статистика перерахується при наступному відкритті
  } catch (e) {
    Object.assign(item, before);
    toast(e.message);
    if (e.code === 'conflict') await loadList({ silent: true, fresh: true });
  } finally {
    state.pending--;
    if (tab === state.tab) render();
  }
}

// Переставляє картку в колонці: рядок у таблиці переїжджає перед before (або після after).
async function move(item, before, after) {
  if (!before && !after) return;
  const tab = state.tab, items = state.data.items;
  items.splice(items.indexOf(item), 1);
  items.splice(before ? items.indexOf(before) : items.indexOf(after) + 1, 0, item);
  render();
  state.pending++;
  state.loadSeq++;
  try {
    await api(null, {
      action: 'move', tab, row: item.row, expectedTitle: item.title,
      ...(before ? { before: before.row, beforeTitle: before.title } : { after: after.row, afterTitle: after.title }),
    });
    state.statsStale = true;
  } catch (e) {
    toast(e.message);
  } finally {
    state.pending--;
    if (tab === state.tab) await loadList({ silent: true, fresh: true }); // номери рядків змінились
  }
}

async function create(status, title) {
  const tab = state.tab;
  state.loadSeq++;
  const temp = { row: 0, title, status, project: state.project, hours: null, assignee: '', deadline: '', doneDate: '' };
  state.data.items.push(temp);
  render();
  state.pending++;
  try {
    const res = await api(null, { action: 'create', tab, item: { title, status, project: state.project || undefined } });
    Object.assign(temp, res.item);
    state.statsStale = true;
  } catch (e) {
    state.data.items.splice(state.data.items.indexOf(temp), 1);
    toast(e.message);
  } finally {
    state.pending--;
    if (tab === state.tab) render();
  }
}

$('#board').addEventListener('change', (e) => {
  if (!e.target.matches('[data-status-select]')) return;
  const item = findItem(e.target.closest('[data-row]').dataset.row);
  if (item) save(item, { status: e.target.value });
});

$('#board').addEventListener('click', (e) => {
  const add = e.target.closest('[data-add]');
  if (add) return openAddForm(add);
  if (e.target.closest('select, a') || Date.now() - state.lastDrag < 300) return;
  const card = e.target.closest('[data-row]');
  if (card) openEdit(findItem(card.dataset.row));
});

$('#board').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('[data-row]')) openEdit(findItem(e.target.dataset.row));
});

function openAddForm(btn) {
  const status = btn.dataset.add;
  const form = document.createElement('form');
  form.dataset.addForm = '';
  form.innerHTML = `<input name="title" required placeholder="Task title" aria-label="New task title" class="block w-full rounded-md border border-neutral-950/15 bg-white px-3 py-2 text-sm outline-none focus:border-accent dark:border-white/15 dark:bg-neutral-900">`;
  btn.replaceWith(form);
  const input = form.elements.title;
  input.focus();
  const close = () => { if (form.isConnected) form.replaceWith(btn); };
  input.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  input.addEventListener('blur', () => { if (!input.value.trim()) close(); });
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const title = input.value.trim();
    if (!title) return;
    form.remove();
    create(status, title);
  });
}

// ---------- редагування ----------
const dialog = $('#editDialog'), editForm = $('#editForm');
let editing = null;

function openEdit(item) {
  if (!item) return;
  editing = item;
  const f = editForm.elements;
  f.title.value = item.title;
  f.hours.value = item.hours == null ? '' : fmtHours(item.hours);
  f.project.value = item.project;
  f.assignee.value = item.assignee;
  f.comment.value = item.comment;
  [f.deadline.value, f.deadlineTime.value = ''] = (item.deadlineIso || '').split('T');
  f.deadlineTime.disabled = !f.deadline.value;
  f.doneDate.value = (item.doneDateIso || '').split('T')[0];
  const cols = state.data.columns;
  for (const name of ['hours', 'project', 'assignee', 'comment', 'deadline', 'doneDate']) f[name].closest('label, [role=group]').hidden = !cols.includes(name);
  $('#editError').textContent = '';
  dialog.showModal();
}

editForm.addEventListener('submit', (e) => {
  if (e.submitter?.value !== 'save' || !editing) return;
  const f = editForm.elements, patch = {};
  const hoursText = f.hours.value.trim().replace(/\s/g, '').replace(',', '.');
  const hours = hoursText === '' ? null : Number(hoursText);
  if (Number.isNaN(hours)) { e.preventDefault(); $('#editError').textContent = MESSAGES.bad_hours; return; }
  const next = { title: f.title.value.trim(), hours, project: f.project.value.trim(), assignee: f.assignee.value.trim(), comment: f.comment.value.trim(),
    deadline: f.deadline.value && f.deadlineTime.value ? `${f.deadline.value}T${f.deadlineTime.value}` : f.deadline.value,
    doneDate: f.doneDate.value };
  if (!next.title) { e.preventDefault(); $('#editError').textContent = MESSAGES.title_required; return; }
  const cur = { ...editing, deadline: editing.deadlineIso || '', doneDate: (editing.doneDateIso || '').split('T')[0] };
  for (const k of Object.keys(next)) {
    if (k !== 'title' && !state.data.columns.includes(k)) continue;
    if ((next[k] ?? '') !== (cur[k] ?? '')) patch[k] = next[k];
  }
  if (Object.keys(patch).length) save(editing, patch);
});
dialog.addEventListener('close', () => { editing = null; });
editForm.elements.deadline.addEventListener('input', (e) => {
  editForm.elements.deadlineTime.disabled = !e.target.value;
  if (!e.target.value) editForm.elements.deadlineTime.value = '';
});

// ---------- вид: дошка / статистика ----------
function setView(view) {
  state.view = view === 'stats' ? 'stats' : 'board';
  store.set('kanbanView', state.view);
  document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.view === state.view));
  $('#board').hidden = $('#boardControls').hidden = state.view !== 'board';
  $('#stats').hidden = state.view !== 'stats';
  if (state.view !== 'stats') return;
  if (state.stats) renderStats();
  if (!state.stats || state.statsStale) loadStats();
}
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));

// ---------- статистика ----------
const NORM = 87; // норма годин на місяць (20 год/тиждень × 52 / 12) — понад неї рахується овертайм
const OVERTIME_ROW = /^overtime/i; // рядок-оцінка овертайму — не робота, не рахуємо
const CARRYOVER_ROW = /^(години за|hours for)/i; // перенесені години: входять у суму місяця, але не в проєкти/типи/задачі
const CATEGORIES = [ // перша збіжна категорія виграє; решта — «Other»
  ['Presentations', /presentation|slide|презен|проезентац|pitch|deck|дека|слайд|пропозал|proposal|outlook/i],
  ['Identity, style, design systems', /identity|brand|logo|style|guideline|template|business card|merch|packag|design system|айдентик|ідентик|ідентичн|стил|логотип|логобук|бренд|систем|гайдлайн|шаблон|візит|мерч|пакуванн|подарунк/i],
  ['Websites and landing pages', /website|web ?page|site|сайт|лендінг|landing|посадков|портал/i],
  ['Posts and social media', /post|social|banner|stor(y|ies)|carousel|публіка|пост|допис|соцмереж|соціальн|інстаграм|instagram|linkedin|сторіс|карусел|банер|reels/i],
  ['Documents and reports', /document|brochure|certificate|letter|sheet|dashboard|invoice|review|analys|звіт|report|документ|one.?pager|резюме|брошур|бланк|сертифікат|лист|framework|схем|а3|a3|дашборд|органігр|інвойс|каталог|catalog|огляд|аналіз/i],
];
const SERIES = 7; // перші 7 проєктів — власний колір, решта — «Інше»
const EN_MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
const sumHours = (items) => items.reduce((s, i) => s + (i.hours || 0), 0);
const pct = (a, b) => `${b ? Math.round((a / b) * 100) : 0}%`;

function monthLabel(tab) {
  const m = tab.trim().match(/^([a-z]+)\s+(\d{2}|\d{4})$/i);
  const i = m ? EN_MONTHS.indexOf(m[1].slice(0, 3).toLowerCase()) : -1;
  return i < 0 ? tab : `${EN_MONTHS[i][0].toUpperCase()}${EN_MONTHS[i].slice(1)} ${m[2].slice(-2)}`;
}

async function loadStats({ fresh = false, background = false } = {}) {
  const box = $('#stats'), btn = $('#refreshBtn');
  const msg = (text) => { box.innerHTML = `<p class="py-16 text-center text-sm text-neutral-500 dark:text-neutral-400">${esc(text)}</p>`; };
  if (!state.stats) state.stats = cacheGet('kanbanStats');
  const visible = () => state.view === 'stats';
  if (visible()) { if (state.stats) renderStats(); else msg('Loading all months…'); }
  if (!background) btn.disabled = true;
  try {
    state.stats = (await api({ action: 'all', ...(fresh && { fresh: 1 }) })).tabs;
    state.statsStale = false;
    cacheSet('kanbanStats', state.stats);
    projectColors = null;
    if (visible()) renderStats();
    else if (state.data && !state.dragging && !state.pending && !document.querySelector('[data-add-form]')) render(); // кольори чіпів
  } catch (e) {
    if (e.code === 'unauthorized' || !visible()) return;
    if (state.stats) toast(e.message); else msg(e.message);
  } finally {
    if (!background) btn.disabled = false;
  }
}

function computeStats(tabs) {
  // Вкладки йдуть від новішої до старішої — для графіків розвертаємо.
  const months = tabs.slice().reverse().map((t) => {
    const items = t.items.filter((i) => !OVERTIME_ROW.test(i.title));
    return { label: monthLabel(t.tab), hours: sumHours(items), work: items.filter((i) => !CARRYOVER_ROW.test(i.title)) };
  });
  const byProject = new Map();
  months.forEach((m, mi) => m.work.forEach((i) => {
    const k = norm(i.project);
    if (!byProject.has(k)) byProject.set(k, { name: i.project.trim() || 'No project', total: 0, months: months.map(() => 0) });
    const p = byProject.get(k);
    p.total += i.hours || 0;
    p.months[mi] += i.hours || 0;
  }));
  let projects = [...byProject.values()].filter((p) => p.total > 0).sort((a, b) => b.total - a.total);
  if (projects.length > SERIES) {
    const rest = projects.slice(SERIES);
    projects = projects.slice(0, SERIES).concat({ name: 'Other', other: true, total: sumHours(rest.map((p) => ({ hours: p.total }))), months: months.map((_, mi) => rest.reduce((s, p) => s + p.months[mi], 0)) });
  }
  projects.forEach((p, i) => { p.color = p.other ? 'var(--series-other)' : `var(--series-${i + 1})`; });

  const work = months.flatMap((m) => m.work.map((i) => ({ ...i, month: m.label })));
  const cats = CATEGORIES.map(([name]) => ({ name, total: 0 })).concat({ name: 'Other', total: 0 });
  work.forEach((i) => {
    const k = CATEGORIES.findIndex(([, re]) => re.test(i.title));
    cats[k < 0 ? cats.length - 1 : k].total += i.hours || 0;
  });

  const hours = months.map((m) => m.hours), sorted = hours.slice().sort((a, b) => a - b), n = hours.length;
  return {
    months, projects, work,
    cats: cats.filter((c) => c.total > 0).sort((a, b) => (a.name === 'Other') - (b.name === 'Other') || b.total - a.total),
    top: work.slice().sort((a, b) => (b.hours || 0) - (a.hours || 0)).slice(0, 10),
    total: sumHours(months),
    avg: n ? sumHours(months) / n : 0,
    median: n ? (n % 2 ? sorted[(n - 1) / 2] : (sorted[n / 2 - 1] + sorted[n / 2]) / 2) : 0,
    last6: sumHours(months.slice(-6)) / Math.min(6, n || 1),
    done: work.filter((i) => norm(i.status) === 'done').length,
    projectCount: [...byProject.keys()].filter(Boolean).length,
    over: months.filter((m) => m.hours > NORM),
  };
}

function renderStats() {
  const s = computeStats(state.stats);
  if (!s.months.length) return void ($('#stats').innerHTML = '<p class="py-16 text-center text-sm text-neutral-500">No data.</p>');
  const card = 'rounded-lg border border-neutral-950/10 p-4 dark:border-white/10';
  const muted = 'text-neutral-500 dark:text-neutral-400';
  const section = (title, sub, body) => `<section><h2 class="text-base font-semibold">${title}</h2>${sub ? `<p class="mt-0.5 text-sm ${muted}">${sub}</p>` : ''}<div class="mt-4">${body}</div></section>`;
  const tile = (label, value, note = '') => `<div class="${card}"><p class="text-xs ${muted}">${label}</p><p class="mt-1 text-2xl font-semibold tabular-nums">${value}</p>${note ? `<p class="mt-0.5 text-xs ${muted}">${note}</p>` : ''}</div>`;
  const h = (n) => `${fmtHours(n)} h`;

  // Години по місяцях: стовпчики + лінії середнього і норми
  const max1 = Math.max(NORM, ...s.months.map((m) => m.hours)) * 1.08;
  const y1 = (v) => `${((v / max1) * 100).toFixed(2)}%`;
  const refLine = (v, label, style) => `<div class="pointer-events-none absolute inset-x-0 border-t ${style}" style="bottom:${y1(v)}"><span class="absolute right-0 -translate-y-full bg-white/80 px-1 text-[11px] ${muted} dark:bg-neutral-950/80">${label}</span></div>`;
  const labels = `<div class="flex gap-1.5 pt-1.5">${s.months.map((m) => `<span class="flex-1 text-center text-[11px] ${muted}">${esc(m.label)}</span>`).join('')}</div>`;
  const monthsChart = `<div class="overflow-x-auto"><div class="min-w-[36rem]">
    <div class="relative flex h-56 items-end gap-1.5 border-b border-neutral-950/15 dark:border-white/15">
      ${s.months.map((m) => `<div class="flex h-full flex-1 items-end" data-tip="${esc(m.label)}: ${h(m.hours)}${m.hours > NORM ? `, ${fmtHours(m.hours - NORM)} over target` : ''}">
        <div class="w-full rounded-t-[4px]" style="height:${y1(m.hours)};background:var(${m.hours > NORM ? '--viz-bar-over' : '--viz-bar'})"></div></div>`).join('')}
      ${refLine(NORM, `target ${NORM}`, 'border-dotted border-neutral-950/50 dark:border-white/50')}
      ${refLine(s.avg, `average ${fmtHours(Math.round(s.avg))}`, 'border-dashed border-neutral-950/30 dark:border-white/30')}
    </div>${labels}</div></div>
    <p class="mt-2 flex items-center gap-2 text-xs ${muted}"><span class="size-2.5 rounded-sm" style="background:var(--viz-bar-over)"></span>months over target</p>`;

  // Проєкти по місяцях: складені стовпчики
  const max2 = Math.max(...s.months.map((_, mi) => s.projects.reduce((t, p) => t + p.months[mi], 0)), 1) * 1.05;
  const legend = `<div class="mb-3 flex flex-wrap gap-x-4 gap-y-1 text-xs">${s.projects.map((p) => `<span class="flex items-center gap-1.5"><span class="size-2.5 rounded-sm" style="background:${p.color}"></span>${esc(p.name)}</span>`).join('')}</div>`;
  const stacked = `${legend}<div class="overflow-x-auto"><div class="min-w-[36rem]">
    <div class="flex h-56 items-end gap-1.5 border-b border-neutral-950/15 dark:border-white/15">
      ${s.months.map((m, mi) => {
        const segs = s.projects.filter((p) => p.months[mi] > 0);
        return `<div class="flex h-full flex-1 flex-col-reverse gap-[2px]">${segs.map((p, si) => `<div data-tip="${esc(m.label)}, ${esc(p.name)}: ${h(p.months[mi])}" class="w-full ${si === segs.length - 1 ? 'rounded-t-[4px]' : ''}" style="height:${((p.months[mi] / max2) * 100).toFixed(2)}%;background:${p.color}"></div>`).join('')}</div>`;
      }).join('')}
    </div>${labels}</div></div>`;

  // Горизонтальні смуги (проєкти, типи робіт)
  const barList = (rows, total) => {
    const max = Math.max(...rows.map((r) => r.total), 1);
    return `<div class="space-y-2.5">${rows.map((r) => `<div class="grid grid-cols-[1fr_auto] items-center gap-x-3 gap-y-1 text-sm sm:grid-cols-[minmax(0,11rem)_1fr_7.5rem]" data-tip="${esc(r.name)}: ${h(r.total)} (${pct(r.total, total)})">
      <span class="truncate">${esc(r.name)}</span>
      <div class="order-last col-span-2 h-2.5 sm:order-none sm:col-span-1"><div class="h-full rounded-r-[4px]" style="width:${((r.total / max) * 100).toFixed(2)}%;background:${r.color || 'var(--viz-cat)'}"></div></div>
      <span class="flex justify-end gap-3 tabular-nums ${muted}"><span>${fmtHours(Math.round(r.total * 10) / 10)}</span><span class="w-9 text-right">${pct(r.total, total)}</span></span></div>`).join('')}</div>`;
  };
  const projSum = sumHours(s.projects.map((p) => ({ hours: p.total })));
  const catSum = sumHours(s.cats.map((c) => ({ hours: c.total })));

  const top = `<div class="overflow-x-auto"><table class="w-full text-left text-sm">
    <thead class="text-xs ${muted}"><tr class="border-b border-neutral-950/10 dark:border-white/10"><th class="py-2 pr-3 font-medium">Month</th><th class="py-2 pr-3 font-medium">Task</th><th class="py-2 pr-3 font-medium">Project</th><th class="py-2 text-right font-medium">Hours</th></tr></thead>
    <tbody>${s.top.map((i) => `<tr class="border-b border-neutral-950/5 dark:border-white/5"><td class="py-2 pr-3 whitespace-nowrap ${muted}">${esc(i.month)}</td><td class="py-2 pr-3">${esc(i.title)}</td><td class="py-2 pr-3 whitespace-nowrap ${muted}">${esc(i.project)}</td><td class="py-2 text-right tabular-nums">${fmtHours(i.hours)}</td></tr>`).join('')}</tbody></table></div>`;

  const monthTable = `<details class="mt-3 text-sm"><summary class="cursor-pointer ${muted}">Monthly table</summary>
    <table class="mt-2 w-full max-w-xs text-sm"><tbody>${s.months.map((m) => `<tr class="border-b border-neutral-950/5 dark:border-white/5"><td class="py-1 ${muted}">${esc(m.label)}</td><td class="py-1 text-right tabular-nums">${fmtHours(m.hours)}</td></tr>`).join('')}</tbody></table></details>`;

  $('#stats').innerHTML = `
    <div><h2 class="text-xl font-semibold">${esc(s.months[0].label)} — ${esc(s.months.at(-1).label)}</h2>
      <p class="mt-1 text-sm ${muted}">Target ${NORM} h per month</p></div>
    <div class="grid grid-cols-2 gap-3 md:grid-cols-4">
      ${tile('Total hours', fmtHours(Math.round(s.total * 10) / 10))}
      ${tile('Monthly average', fmtHours(Math.round(s.avg * 10) / 10), `median ${fmtHours(s.median)}`)}
      ${tile('Last 6 months avg', fmtHours(Math.round(s.last6 * 10) / 10))}
      ${tile('Tasks done', s.done, `projects: ${s.projectCount}`)}
    </div>
    ${s.over.length ? `<p class="-mt-6 text-sm ${muted}">Over target: ${s.over.map((m) => `${esc(m.label)} (+${fmtHours(m.hours - NORM)})`).join(', ')}</p>` : ''}
    ${section('Hours by month', '', monthsChart + monthTable)}
    ${section('Projects by month', '', stacked)}
    ${section('Hours by project', `${h(Math.round(projSum * 10) / 10)} in tasks`, barList(s.projects, projSum))}
    ${section('Work types', 'By keywords in the task title', barList(s.cats, catSum))}
    ${section('Largest tasks', '', top)}`;
}

const tip = $('#tip');
function showTip(e) {
  const t = e.target.closest?.('[data-tip]');
  if (!t) return void (tip.hidden = true);
  tip.textContent = t.dataset.tip;
  tip.hidden = false;
  tip.style.left = `${Math.max(8, Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8))}px`;
  tip.style.top = `${Math.max(8, e.clientY - tip.offsetHeight - 12)}px`;
}
$('#stats').addEventListener('pointermove', showTip);
$('#stats').addEventListener('pointerdown', showTip);
$('#stats').addEventListener('pointerleave', () => { tip.hidden = true; });

// ---------- старт ----------
const hashKey = new URLSearchParams(location.hash.slice(1)).get('key');
if (hashKey) {
  store.set('kanbanKey', hashKey);
  history.replaceState(null, '', location.pathname + location.search);
}
key = hashKey || store.get('kanbanKey') || '';
if (key) start(); else logout();
</script>
